
name: Attach Plugin ZIP to Release

# リリースが手動で作成され、公開されたときにトリガー
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.event.release.tag_name }}

    steps:
      # コードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v7

      # プラグインZIPを作成
      - name: Prepare plugin ZIP
        run: |
          set -euo pipefail

          mkdir wp-sameterm-pager

          # rsync を使用して必要なファイルをコピー
          rsync -av \
            --exclude='/wp-sameterm-pager/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/src/' \
            --exclude='/package.json' \
            --exclude='/webpack.config.js' \
            ./ wp-sameterm-pager/

          # ZIPファイルの作成
          zip -r "wp-sameterm-pager-${VERSION}.zip" wp-sameterm-pager

      # 作成したZIPをリリースに添付
      - name: Upload ZIP to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION" \
            "wp-sameterm-pager-${VERSION}.zip" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
